{% extends "layouts/app.html" %}

{% block title %}Reset Password | Medical Store Management{% endblock %}
{% block page_heading %}Reset Password{% endblock %}

{% block content %}
<section class="page-header">
    <div>
        <p class="section-kicker">Employee Management</p>
        <h1>Reset Password</h1>
        <p>{{ employee.display_name }} - {{ employee.username }}</p>
    </div>
    <a href="{{ url_for('employees.detail', employee_id=employee.user_id) }}" class="btn btn-outline-primary"><i class="bi bi-arrow-left me-2"></i>Back</a>
</section>

<section class="panel-card form-panel">
    <form method="post" class="row g-3" novalidate>
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="col-md-6">
            <label class="form-label" for="password">New Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="confirm_password">Confirm Password</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
        </div>
        <div class="col-12 d-flex justify-content-end gap-2">
            <a href="{{ url_for('employees.detail', employee_id=employee.user_id) }}" class="btn btn-light">Cancel</a>
            <button type="submit" class="btn btn-primary"><i class="bi bi-key me-2"></i>Reset Password</button>
        </div>
    </form>
</section>
{% endblock %}
