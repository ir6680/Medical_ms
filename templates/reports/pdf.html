<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div><h1 class="h3 mb-1">{{ title }}</h1><p class="text-muted mb-0">Printable report</p></div>
        <button class="btn btn-primary" onclick="window.print()">Print / Save PDF</button>
    </div>
    <table class="table table-bordered table-sm">
        <thead><tr><th>ID</th><th>Date</th><th>Name</th><th>Count/Qty</th><th class="text-end">Amount</th></tr></thead>
        <tbody>
            {% for row in rows %}
                <tr><td>{{ row.id }}</td><td>{{ row.report_date }}</td><td>{{ row.party }}</td><td>{{ row.count_value }}</td><td class="text-end">{{ row.amount }}</td></tr>
            {% else %}
                <tr><td colspan="5" class="text-center text-muted">No report rows found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
